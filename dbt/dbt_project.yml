name: supply_chain
version: "1.0.0"
config-version: 2

profile: supply_chain  

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  supply_chain:
    +materialized: view
    silver:
      +schema: silver
      +materialized: table
      +file_format: delta
    gold:
      +schema: gold
      +materialized: table
      +file_format: delta
      dims:     {+tags: ['star']}
      facts:    {+tags: ['star']}
      features: {+tags: ['ml']}

vars:
  m5_max_day: 1941
  forecast_horizon: 28
  m5_valid_start_day: 1886
  m5_test_start_day: 1914
  olist_valid_start: '2018-04-01'
  olist_test_start: '2018-06-01'

seeds:
  supply_chain:
    +schema: bronze